<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shapes with hands</title>
    <style>
    html,

    body {
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background-color: white;
        color: black;
        text-align: center;
       }

    header {
        margin-top: 20px;
    }

    h1{
        font-size: 3em;
        font-weight: bold;
    }

    h2{
        font-size: 1.5rem;
    }

    main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; 
    padding-top: 40px;

    }

    #sketch {
        width: 100%;
        height: 100vh;
        position: relative;
        overflow: hidden;
        z-index: 1000;
    }

@keyframes fall {
  to {
    transform: translateY(100vh);
    opacity: 0;
  }
}
</style>

</head>

<header> 
    	<div id="backlink">
		<style>
			#backlink {
				--color-accent: hsl(198, 100%, 50%);
				position: absolute;
				top: 8px;
				right: 8px;
				border: 1px dashed black;
				background-color: white;
				padding: 8px;
				cursor: pointer;
				color: black;
				font-size: 0.8rem;
				font-weight: bold;
				transition: all 0.3s ease;
				transform: rotate(-2deg) scale(0.9);
				box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5);
				a {
					text-decoration: none;
					color: black;
					color: inherit;
					text-decoration: underline;
					background-image: linear-gradient(to right,
							var(--color-accent) 0%,
							var(--color-accent) 100%);
					background-size: 0% 100%;
					background-position: left center;
					background-repeat: no-repeat;
					transition: background-size 0.2s ease-in-out;
					padding: 0.5rem;
				}
				a:hover {
					background-size: 100% 100%;
					color: white;
				}

			}
			#backlink:hover {
				transform: rotate(2deg) scale(1);
			}
		</style>
		<a href="https://rundgang2025.qawsed.site">Back to the Rundgang 2025</a>
	</div>
    <h1>shapes with hands</h1>
    <h2>Make a shape or sign with your hands!</h2>
</header>

<body>
<main>
    <div id="sketch"></div>
    <a href="index.js">source code</a>
    </main>

    <script src="index.js"></script>
</body>
</html>
